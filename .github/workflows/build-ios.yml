# Builds an UNSIGNED .ipa on a macOS runner. No Apple secrets, no cert, no
# provisioning profile — this just produces the compiled app bundle, zipped
# into IPA shape. You sign it yourself afterward (Xcode's Devices window,
# Apple Configurator, or `codesign`/`altool`), since that's the part that
# actually requires your Apple Developer account.
#
# To get the unsigned IPA:
#   GitHub → Actions → "Build iOS app" → Run workflow
#   When it finishes, download the "flash-sender-ios-ipa-unsigned" artifact.
#
# Pushing a tag like v1.0.0 also attaches it to the GitHub Release (the same
# one the Windows installer attaches to).
#
# Runs on macos-14 because the project's native ios/ directory is generated
# fresh every run via `expo prebuild` (Continuous Native Generation) — it is
# never committed, per this project's own mobile/AGENTS.md.

name: Build iOS app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - claude/flash-sender-windows-app-zu3zmm

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    defaults:
      run:
        working-directory: flash-sender/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flash-sender/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean
        env:
          CI: true

      - name: Resolve the generated Xcode workspace and scheme
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json \
            | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write(d.workspace.schemes[0]);")
          echo "XC_WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "XC_SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Archive (unsigned)
        run: |
          xcodebuild \
            -workspace "$XC_WORKSPACE" \
            -scheme "$XC_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FlashSender.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive

      - name: Package the unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/FlashSender.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in the archive — the build above did not actually produce one." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          mkdir -p "$RUNNER_TEMP/ipa"
          ( cd "$RUNNER_TEMP" && zip -r -X -q "ipa/FlashSenderByNora-unsigned.ipa" Payload )

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: flash-sender-ios-ipa-unsigned
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/ipa/*.ipa
          generate_release_notes: true
