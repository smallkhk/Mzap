# Builds Flash-Sender-by-Nora-Setup.exe on a Windows runner.
#
# The installer cannot be produced on Linux/macOS without Wine, and code
# signing only works on Windows, so the build runs on windows-latest here.
#
# To get an installer:
#   GitHub → Actions → "Build Windows installer" → Run workflow
#   When it finishes, download the "flash-sender-windows-installer" artifact.
#
# Pushing a tag like v1.0.0 also builds and attaches the installer to a
# GitHub Release.

name: Build Windows installer

on:
  workflow_dispatch: # manual trigger — the usual way to use this
  push:
    tags:
      - 'v*'

# Needed so the tag-triggered run can attach the installer to a Release.
# Repositories default the workflow token to read-only.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: flash-sender/desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flash-sender/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and run tests
        run: |
          npm run typecheck
          npm test

      - name: Build and package
        run: npm run package:win
        env:
          # Code signing is optional. If these repository secrets are absent the
          # build still succeeds, but Windows SmartScreen will warn users on
          # first run. See docs/BUILD-WINDOWS.md.
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: flash-sender-windows-installer
          path: |
            flash-sender/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: flash-sender/desktop/release/*.exe
          generate_release_notes: true
