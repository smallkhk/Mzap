# Local PostgreSQL for development.
# Production deployments should use a managed database — see docs/DEPLOYMENT.md.

services:
  db:
    image: postgres:16-alpine
    container_name: flash-sender-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash
      POSTGRES_DB: flashsender
    ports:
      - '5432:5432'
    volumes:
      - flash-sender-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flash -d flashsender']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  flash-sender-db:
