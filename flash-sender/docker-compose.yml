# Local MariaDB for development, matching what shared hosting (cPanel)
# provides. Production deployments use the host's own database — see
# docs/DEPLOYMENT.md and docs/CPANEL.md.

services:
  db:
    image: mariadb:11
    container_name: flash-sender-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_USER: flash
      MARIADB_PASSWORD: flash
      MARIADB_DATABASE: flashsender
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - '3306:3306'
    volumes:
      - flash-sender-db:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  flash-sender-db:
